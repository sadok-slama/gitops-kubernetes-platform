# CI pipeline (Continuous Integration + "update desired state in Git").
# It never talks to the Kubernetes cluster: Argo CD pulls the change from Git (GitOps).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # The pipeline itself commits to environments/; ignoring that path avoids a pipeline loop.
    paths-ignore:
      - "environments/**"

# Least privilege by default; jobs that need more declare it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: gitops-sample-app
  K8S_SCHEMA_VERSION: "1.31.0"
  CRD_SCHEMA_LOCATION: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        working-directory: app
        run: python -m pytest -v

  validate:
    name: Lint and validate YAML / Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Install yamllint
        run: pip install yamllint==1.38.0
      - name: Install kubeconform (checksum verified)
        run: |
          curl -sSL -o kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - name: yamllint
        run: yamllint -c .yamllint.yaml .
      - name: helm lint
        run: |
          helm lint helm/sample-app
          helm lint helm/sample-app -f helm/sample-app/values-dev.yaml -f environments/dev/values.yaml
      - name: Render and validate manifests with kubeconform
        run: |
          helm template sample-app helm/sample-app --namespace sample-app-dev > rendered-default.yaml
          helm template sample-app helm/sample-app --namespace sample-app-dev \
            -f helm/sample-app/values-dev.yaml -f environments/dev/values.yaml > rendered-dev.yaml
          for f in rendered-default.yaml rendered-dev.yaml argocd/project.yaml argocd/application.yaml; do
            echo "== $f"
            kubeconform -strict -summary -kubernetes-version "$K8S_SCHEMA_VERSION" \
              -schema-location default -schema-location "$CRD_SCHEMA_LOCATION" "$f"
          done

  build-scan:
    name: Build image and Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (loaded locally, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish image to GHCR
    # Only for pushes to main, and only after every check succeeded. Never runs for pull requests or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, validate, build-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute image name and immutable tag
        id: vars
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: true
          tags: ${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.tag }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    name: Update image tag in Git (desired state)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gitops-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set the new tag in environments/dev/values.yaml
        env:
          NEW_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          git pull --rebase origin main
          sed -i -E "s|^(  tag: ).*|\1\"${NEW_TAG}\" # managed by CI|" environments/dev/values.yaml
          grep -n "tag:" environments/dev/values.yaml
      - name: Commit and push (Argo CD will detect this commit)
        env:
          NEW_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          if git diff --quiet; then
            echo "Tag already up to date, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add environments/dev/values.yaml
          git commit -m "chore(gitops): deploy ${NEW_TAG} to dev [skip ci]"
          git push origin HEAD:main
