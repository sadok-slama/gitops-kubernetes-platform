petclinic:
  replicaCount: 2
  image:
    repository: sadokslamaesprit/petclinic
    tag: "4ea97300b642ad38eed34701bde844de1543f808"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 1000m

postgres:
  image:
    repository: postgres
    tag: "18.4"
    pullPolicy: IfNotPresent
  database: petclinic
  username: petclinic
  service:
    port: 5432
  persistence:
    enabled: true
    size: 5Gi
    storageClass: standard
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 768Mi
      cpu: 1000m

databaseSecret:
  name: petclinic-db
