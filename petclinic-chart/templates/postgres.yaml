apiVersion: v1
kind: Service
metadata:
  name: {{ include "petclinic.fullname" . }}-postgres-headless
  labels:
    {{- include "petclinic.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: {{ include "petclinic.fullname" . }}-postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "petclinic.fullname" . }}-postgres
  labels:
    {{- include "petclinic.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "petclinic.fullname" . }}-postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "petclinic.fullname" . }}-postgres
  labels:
    {{- include "petclinic.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "petclinic.fullname" . }}-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "petclinic.fullname" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "petclinic.fullname" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret.name }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "petclinic", "-d", "petclinic"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "petclinic", "-d", "petclinic"]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
